<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LingQ Click Translator</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="mini">
      <header class="mini__header">
        <div class="brand-mark">LQ</div>
        <div>
          <h1>LingQ Click Translator</h1>
          <p>Klikněte na slovo a uvidíte překlad</p>
        </div>
      </header>

      <div class="status-card">
        <span class="status-dot" id="status-dot"></span>
        <div>
          <strong id="status-title">Doplněk je aktivní</strong>
          <span id="status-description">Funguje na všech webových stránkách</span>
        </div>
        <label class="switch">
          <input type="checkbox" id="enabled" />
          <span class="slider"></span>
        </label>
      </div>

      <button type="button" class="open-app-button" id="open-app">
        Otevřít doplněk
      </button>
      <p class="mini__hint">Slovník, Import, Statistiky, Nastavení a Návod se otevřou na celé stránce.</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
